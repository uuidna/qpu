name: compare
# Compare prod and dev through the quantum e2e gate (the repetition code): every combination on both hosts
# (prod https://qpu.uuidna.com/mcp and the operator's dev workers.dev, the e2e tool's default hosts), decoded
# by majority — a drift is the syndrome, each drift a lead the loop improves. Run by hand (workflow_dispatch)
# and on a schedule (cron), via the app's Payload MCP; no secret in the tree.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily, the autonomous prod/dev compare
# least privilege (Scorecard Token-Permissions): the tree is read, the compare uploaded by the runtime token alone
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: compare prod and dev (quantum e2e, decoded by majority)
        run: node scripts/e2e.ts --strict
        env:
          QPU_APP_MCP: ${{ secrets.QPU_APP_MCP }}
          QPU_APP_KEY: ${{ secrets.QPU_APP_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compare
          path: docs/public/e2e.json
