# Land a pull request once its checks are green, then deploy: no hand merges it and no hand starts the deploy.
# It runs when lean-verify or site finishes on a pull request of this repository (never a fork), reads every check on
# that head, and merges only when all of them have passed. A merge made here does not start push workflows, so the
# deploy is started here. The pull request's code is never checked out or run by this workflow.
name: land
on:
  workflow_run:
    workflows: [lean-verify, site]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
concurrency:
  group: land-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  land:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: find the open pull request of this head
        id: pr
        run: |
          number=$(gh pr list --state open --base main --head "$HEAD_BRANCH" --json number,headRefOid,isDraft \
            --jq "map(select(.headRefOid == \"$HEAD_SHA\" and (.isDraft | not))) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: every check on the head has passed
        id: green
        if: steps.pr.outputs.number != ''
        run: |
          pending=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "land") | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: merge, then start the deploy
        if: steps.pr.outputs.number != '' && steps.green.outputs.pending == '0'
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run deploy.yml --ref main
