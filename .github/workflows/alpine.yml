name: alpine
# Every gate in qpu's one environment: the image alpine/Dockerfile builds (Lean from source on musl, Node 26, pnpm), so
# a branch is verified whatever the pushing session could run.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
# One build per branch and event: a newer head waits for the running one, which finishes and fills the layer cache,
# instead of cancelling it; heads pushed meanwhile are skipped for the newest. A pull request from a branch the push
# trigger already builds runs no second copy, and its skipped run waits in its own group, so it never takes the place
# of the push run that builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  gates:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: alpine/Dockerfile
          target: runtime
          tags: qpu-alpine:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: gates in the Alpine environment
        run: >-
          docker run --rm -v "$PWD:/qpu" -w /qpu qpu-alpine:ci sh -c
          'pnpm install --frozen-lockfile && lake exe cache get && lake build && pnpm run typecheck && pnpm test'
