name: alpine
# Every gate in qpu's one environment: the image alpine/Dockerfile builds (Lean from source on musl, Node 26, pnpm), so
# a branch is verified whatever the pushing session could run. Each gate is a step of its own, so a running job shows
# which gate it is in and how long each took; the Lean build is kept between runs, so only changed modules rebuild.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
# One build per branch and event: a newer head waits for the running one, which finishes and fills the layer cache,
# instead of cancelling it; heads pushed meanwhile are skipped for the newest. A pull request from a branch the push
# trigger already builds runs no second copy, and its skipped run waits in its own group, so it never takes the place
# of the push run that builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  gates:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: alpine/Dockerfile
          target: runtime
          tags: qpu-alpine:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the musl-built packages (Mathlib's cache tool and its unpacked modules) and the tree's own compiled modules
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: alpine-lake-packages-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'alpine/Dockerfile') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: alpine-lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'alpine/Dockerfile') }}-${{ hashFiles('lakefile.lean', 'lean/**/*.lean') }}
          restore-keys: |
            alpine-lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'alpine/Dockerfile') }}-
      # a gate past its time fails with its log, which a running job never shows
      - name: dependencies
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/qpu" -w /qpu qpu-alpine:ci pnpm install --frozen-lockfile
      - name: Mathlib's build cache
        timeout-minutes: 20
        run: docker run --rm -v "$PWD:/qpu" -w /qpu qpu-alpine:ci lake exe cache get
      - name: the Lean kernel checks the tree
        timeout-minutes: 90
        run: docker run --rm -v "$PWD:/qpu" -w /qpu qpu-alpine:ci lake build
      - name: typecheck
        timeout-minutes: 15
        run: docker run --rm -v "$PWD:/qpu" -w /qpu qpu-alpine:ci pnpm run typecheck
      - name: tests
        timeout-minutes: 20
        run: docker run --rm -v "$PWD:/qpu" -w /qpu qpu-alpine:ci pnpm test
      # the container wrote as root: the cache steps that follow read the build as the runner
      - name: hand the build back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .lake
  # The image the Worker's Lean container runs, built the way the deploy builds it: its last layer asks the prover, as the
  # user the server runs as, for one theorem that holds, one that does not and one that needs Mathlib. A branch whose
  # prover image does not build is red here, before it lands, and not after an hour of the deploy. The layers the gates
  # job keeps are read and none is kept from here: the layer that holds Mathlib is rebuilt in minutes.
  prover:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: alpine/Dockerfile
          target: prover
          cache-from: type=gha
