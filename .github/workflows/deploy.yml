# Deploy Worker qpu from main, or when started by hand: Lean writes the site, VitePress builds it, Wrangler deploys the
# Worker that serves it beside /api/mcp. Secrets, by name only: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - run: lake exe cache get
      # the tree's own compiled modules, shared with lean-verify: only changed modules are rebuilt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.lean', 'lean/**/*.lean') }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Worker and the site go live first, in minutes: wrangler deploys them and leaves the Lean container as it
      # runs. The container's image follows; it takes the hour its Lean build takes, so what the build states is not
      # held back by it, and an image that does not build leaves the Worker and the site deployed.
      - name: Lean writes the pages, VitePress builds them, Wrangler deploys the Worker and the site
        run: pnpm run deploy --containers-rollout=none
      - name: smoke /api/mcp and the site on both hostnames
        run: |
          fail=0
          for host in $(node -e "import('./src/quantum/uuid/programs/d/e/a/3/e/d/e/1/index.ts').then((c) => console.log(Object.keys(c.TENANTS).join(' ')))")
          do
            site=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' --max-time 30 "https://$host/")
            # Streamable HTTP answers a plain GET with 405: the endpoint is asked what it serves, as a client asks
            mcp=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' --max-time 60 -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' "https://$host/api/mcp")
            echo "site $site mcp $mcp $host"
            if [ "$site" != "200" ] || [ "$mcp" != "200" ]; then fail=1; fi
          done
          exit "$fail"
      - name: Wrangler builds the image of the Lean container and deploys it
        run: pnpm exec wrangler deploy
      # the gate after the deploy (src/quantum/uuid/programs/f/7/8/4/5/6/e/5/index.ts), asked of the live server the way a client asks: one
      # theorem Lean must accept and one it must reject with its own error, the crypto selftests, and the audit in eight
      # shares. A wrong answer fails the deploy and names what the server said; a prover still starting is asked again,
      # up to five times, each retry printed with its reason.
      - name: the deployed server answers right
        timeout-minutes: 30
        run: node src/quantum/uuid/programs/0/d/b/3/5/7/8/9/index.ts step repository '{"deployed":{}}' --json
      - name: query Worker logs
        run: |
          from=$(( $(date +%s%3N) - 900000 ))
          to=$(date +%s%3N)
          status=$(curl -sS -o /tmp/qpu-obs.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"queryId\":\"qpu-deploy\",\"timeframe\":{\"from\":${from},\"to\":${to}},\"view\":\"events\",\"limit\":5,\"parameters\":{\"datasets\":[\"cloudflare-workers\"],\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"qpu\"}]}}")
          OBS_STATUS="$status" node -e 'const body = JSON.parse(require("fs").readFileSync("/tmp/qpu-obs.json", "utf8")), status = process.env.OBS_STATUS, result = body.result || {}; let events = result.events; if (events && !Array.isArray(events) && typeof events === "object") events = events.events; console.log("observability", status, "events", Array.isArray(events) ? events.length : "none"); process.exit(status === "200" && body.success === true && Array.isArray(events) ? 0 : 1)'
