# Deploy Worker qpu from main, or when started by hand. Payload names the stages. The runner decides nothing.
# Waves, one session: games, home, standards, 3.1, 3.2, 3.3, 3.4, 3.5, 3.6, cicd. Each wave improves the next, and cicd improves home.
# Secrets, by name only: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PAYLOAD_SECRET.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Payload migrate, then the D1 optimize
        run: pnpm run deploy:database
      - name: Payload writes one wave, then the next, in one session
        run: cross-env NODE_ENV=production pnpm run seed
      - name: Payload reads the pages back and deploy is allowed when they agree
        run: cross-env NODE_ENV=production pnpm run seed:check
      - name: OpenNext builds the Payload app and deploys the Worker
        run: pnpm run deploy:app
      - name: smoke the admin on both hostnames
        run: |
          fail=0
          for url in \
            https://qpu.uuidna.com/admin \
            https://qpu.uuidna.com/admin/login \
            https://qpu.psg.bg/admin \
            https://qpu.psg.bg/admin/login
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' --max-time 30 "$url")
            echo "$code $url"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit "$fail"
      - name: query Worker logs
        run: |
          from=$(( $(date +%s%3N) - 900000 ))
          to=$(date +%s%3N)
          status=$(curl -sS -o /tmp/qpu-obs.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"queryId\":\"qpu-deploy\",\"timeframe\":{\"from\":${from},\"to\":${to}},\"view\":\"events\",\"limit\":5,\"parameters\":{\"datasets\":[\"cloudflare-workers\"],\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"qpu\"}]}}")
          OBS_STATUS="$status" node -e 'const fs = require("node:fs"); const status = process.env.OBS_STATUS; const body = JSON.parse(fs.readFileSync("/tmp/qpu-obs.json", "utf8")); const result = body.result || {}; const events = Array.isArray(result.events) ? result.events : []; console.log("observability", status, "events", events.length); process.exit(status === "200" && body.success !== false ? 0 : 1)'
