name: deploy

# qpu.uuidna.com ships only after the same gate pre-push already ran.
# No credential in this file unless CLOUDFLARE_API_TOKEN is set; absent, the gap is named.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build
      - name: Deploy to Cloudflare (only when the token exists)
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_CF" = "true" ]; then
            npm exec -- wrangler deploy
          else
            echo "::notice::ci PASSED but the worker was not deployed — CLOUDFLARE_API_TOKEN is not set"
          fi
