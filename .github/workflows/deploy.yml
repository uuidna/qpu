name: deploy

# qpu.uuidna.com ships after the gate, in the same job as the gate: ci.yml called with deploy. Token gap is named there.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      deploy: true
    secrets: inherit
