# Deploy Worker qpu from main, or when started by hand: Lean writes the site, VitePress builds it, Wrangler deploys the
# Worker that serves it beside /api/mcp. Secrets, by name only: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - run: lake exe cache get
      # the tree's own compiled modules, shared with lean-verify: only changed modules are rebuilt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('lakefile.lean', 'lean/**/*.lean') }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lean writes the pages, VitePress builds them, Wrangler deploys the Worker
        run: pnpm run deploy
      - name: smoke /api/mcp and the site on both hostnames
        run: |
          fail=0
          for host in qpu.uuidna.com qpu.psg.bg
          do
            site=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' --max-time 30 "https://$host/")
            mcp=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' --max-time 30 "https://$host/api/mcp")
            echo "site $site mcp $mcp $host"
            if [ "$site" != "200" ] || [ "$mcp" != "200" ]; then fail=1; fi
          done
          exit "$fail"
      - name: query Worker logs
        run: |
          from=$(( $(date +%s%3N) - 900000 ))
          to=$(date +%s%3N)
          status=$(curl -sS -o /tmp/qpu-obs.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"queryId\":\"qpu-deploy\",\"timeframe\":{\"from\":${from},\"to\":${to}},\"view\":\"events\",\"limit\":5,\"parameters\":{\"datasets\":[\"cloudflare-workers\"],\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"qpu\"}]}}")
          OBS_STATUS="$status" python3 -c 'import json,os,sys; status=os.environ["OBS_STATUS"]; body=json.load(open("/tmp/qpu-obs.json")); result=body.get("result") or {}; events=result.get("events"); events=events.get("events") if isinstance(events, dict) else events; print("observability", status, "events", len(events) if isinstance(events, list) else "none"); sys.exit(0 if status=="200" and body.get("success") is True and isinstance(events, list) else 1)'
