# The tests of the quantum tree, which read the files rendered from Lean. They run on every pull request and on main,
# so a change is tested before it lands, not only on the machine that wrote it.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# a newer push to the same pull request makes the run of the older head useless: it is cancelled; runs on main are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test "src/quantum/**/*_test.ts" "src/quantum/**/*.test.ts"
