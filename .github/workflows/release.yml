# Cut qpu's next release: the tag one patch above the highest version GitHub or Zenodo holds (nextTag in
# src/quantum/processing/release.ts), created at main's head as a GitHub release, which Zenodo archives as a new version
# under the unit's concept DOI. Only a stable tree is released: it refuses unless alpine, lean-verify, site and test
# have each passed on main's head, or, for a merge commit, on the pull request's head with the same tree, and unless
# deploy, whose last gate asks the live server, has passed on main's head. It refuses
# unless src/quantum/package.json states the version, so the tagged tree names its own release. Started by hand on
# main: a release is the author's act. Its note is the description of .zenodo.json, the record the build writes and Zenodo
# reads from the tagged tree, so the note and the archived record state the same achievements, open claims and funding.
# One pipeline from a commit to a release: a pull request lands when its checks pass (land), the landing deploys
# (deploy, whose last gate asks the live server), and a deploy that passed on main starts this workflow. Every refusal
# above still decides: the release is made only when the gates and the deploy passed on main's head, the tree is stable
# and the package states the next tag. Where the package states no new version there is nothing to release, and a run
# the deploy started says so and ends; a run started by hand refuses instead, since the author asked for a release.
name: release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: every gate has passed on this tree
        run: |
          sha=$GITHUB_SHA
          if head=$(git rev-parse -q --verify 'HEAD^2') && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then sha=$head; fi
          for workflow in alpine lean-verify site test
          do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$workflow\" and .conclusion == \"success\")] | length")
            if [ "$passed" = "0" ]; then echo "::error::$workflow has not passed on $sha, so the tree is not released"; exit 1; fi
          done
          # the deploy runs on main alone and ends with the gate on the live server (Lean both ways, the selftests, the
          # audit): a tree whose deployed server answered wrong is not released
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "deploy" and .conclusion == "success")] | length')
          if [ "$deployed" = "0" ]; then echo "::error::deploy, with its gate on the live server, has not passed on $GITHUB_SHA, so the tree is not released"; exit 1; fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
      # stable is the capacity utilised in full and no entropy (repository { stable }): the runner lists the tracked sources, the door measures
      # them with the audit door's entropy, and a tree that is not stable is not released
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - run: pnpm install --frozen-lockfile
      - name: stable, the capacity utilised in full without entropy
        run: node src/quantum/processing/machine-run.ts step repository '{"stable":{"listing":{"$run":{"cmd":"git","args":["ls-files","src/quantum","scripts"]}}}}' --json
      - name: the next tag, which the package states
        id: next
        run: |
          tag=$(node --input-type=module -e "
            import { nextTag, RELEASE_REPOSITORY, UNIT_CONCEPT_DOI } from './src/quantum/processing/release.ts'
            const read = async (url, headers = {}) => { const r = await fetch(url, { headers: { accept: 'application/json', 'user-agent': 'qpu', ...headers } }); return r.ok ? r.json() : {} }
            const [github, zenodo] = await Promise.all([
              read('https://api.github.com/repos/' + RELEASE_REPOSITORY + '/releases/latest', { authorization: 'Bearer ' + process.env.GH_TOKEN }),
              read('https://zenodo.org/api/records/' + UNIT_CONCEPT_DOI.slice(UNIT_CONCEPT_DOI.lastIndexOf('.') + 1))])
            console.log(nextTag([github.tag_name, zenodo.metadata?.version]))")
          version=$(node -p "require('./src/quantum/package.json').version")
          if [ "v$version" != "$tag" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then echo "::notice::nothing to release: the next tag is $tag and src/quantum/package.json states $version"; exit 0; fi
            echo "::error::the next tag is $tag, but src/quantum/package.json states $version"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: the release at main's head
        if: steps.next.outputs.tag != ''
        run: |
          jq -r .description .zenodo.json > "$RUNNER_TEMP/notes.html"
          gh release create "${{ steps.next.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.next.outputs.tag }}" --notes-file "$RUNNER_TEMP/notes.html"
