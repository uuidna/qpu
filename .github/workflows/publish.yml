name: publish

# ONE CI FOR EVERY ENVIRONMENT. Node (the build, the Lean kernel, the gate), Cloudflare Workers (the one Worker:
# Payload fronted by the unit), the container (the image boots and proves itself), npm and the GitHub Release (a tag),
# and the live host itself (QPU is live: every test runs against https://qpu.uuidna.com, after the deploy that made it,
# and on a schedule). Each environment is a job; a push to main deploys and then tests what it deployed; a tag also
# publishes. Nothing else runs a workflow.

on:
  push:
    branches: [main]
    tags: ['v1.*.[0-9]']
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # NODE: install by the lockfile, the Lean kernel (cached as a receipt keyed on the proof and the toolchain pin), the
  # build and the gate (every operation resolves by UUID and qpu_prove holds).
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      - name: Kernel receipt (index.lean bytes and the toolchain pin already checked in an earlier run)
        id: kernel
        uses: actions/cache/restore@v6
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'src/quantum/processing/unit/lean/**', 'src/quantum/processing/unit/index.lean') }}
      - name: Lean toolchain cache (keyed on lean-toolchain; only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        id: elan
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Lean kernel (only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.elan.outputs.cache-hit }}" != "true" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          npm run lean
          sha256sum lean-toolchain src/quantum/processing/unit/index.lean > .lean-ok
      - name: Save the kernel receipt (only after the kernel passed here)
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'src/quantum/processing/unit/lean/**', 'src/quantum/processing/unit/index.lean') }}
      - name: The gate is a formula (gate.push over every family, the proof and the rules, through the MCP)
        run: |
          npm run build
          node scripts/receipt.mjs gate push
      - name: The scripts suites (every scripts/*.test.mjs, discovered by glob)
        run: npm run test:scripts
      # EVERY SCALE PROVES QUANTUM: standalone here (the booted unit proves itself), the container in `image`, the
      # Worker in `test` against the live host; all three run the same qpu_prove on the same bytes
      - name: Standalone proves itself (qpu_prove holds in the booted unit)
        run: node dist/quantum/processing/unit/boot.js --prove
      # README.md is not in the list: its root node is the commit, which the commit that carries the README cannot know,
      # so the README is accountable to the commit before it by design and would always differ here.
      - name: The generated files are what the spec and the receipts generate (deployment, configs, registries, release notes)
        run: |
          node scripts/payload-cloudflare.mjs --repo > /dev/null
          npm run readme
          git diff --exit-code -- wrangler.jsonc Dockerfile docker-compose.yml k8s src/payload.config.ts src/mcp/families.ts src/receipts/index.ts package.json src/blocks/index.ts src/components/blocks/index.ts tsconfig.json tsconfig.payload.json RELEASE.md .zenodo.json

  # CLOUDFLARE WORKERS: the one Worker (uuidna-qpu = the Payload app fronted by the unit) built by OpenNext and deployed.
  deploy:
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Build and deploy the one Worker (named when the token is missing)
        env:
          # the build reads the config; the Worker's own secret is set on Cloudflare and never leaves it
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'build-only' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            if [ "${{ github.repository }}" = "uuidna/qpu" ]; then
              echo "::error::release not published — uuidna/qpu has no CLOUDFLARE_API_TOKEN secret, so this push to main did not ship. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions; every push then ships autonomously via 'npm run ship' (build + opennextjs-cloudflare build + deploy). This is the one credential the tree cannot supply itself."
              exit 1
            fi
            echo "::warning::not deployed: this fork has no CLOUDFLARE_API_TOKEN secret; the tests below run against what is live"
          else
            npm run ship
          fi

  # THE LIVE HOST: every test runs against https://qpu.uuidna.com — after the deploy on a push, as it stands on a pull
  # request or the schedule. On the schedule a failure is filed as the one open `examine` issue.
  test:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'success' || github.event_name == 'schedule') && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Every test, against the live host
        id: live
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          node scripts/examine.mjs https://qpu.uuidna.com 2>&1 | tee -a test.log
          status=$(( status | PIPESTATUS[0] ))
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: File the findings as the open examine issue (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(printf 'Scheduled run against https://qpu.uuidna.com failed on %s (run %s).\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$(grep -E 'not ok|FIND|# (fail|pass)|examine:' test.log | head -80)")"
          number="$(gh issue list --label examine --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create examine --description 'findings of the scheduled run against the live host' --color D93F0B 2>/dev/null || true
            gh issue create --title "examine: qpu.uuidna.com has findings" --label examine --body "$body"
          fi

  # THE CONTAINER: the generated image builds, and inside it the unit proves itself (qpu_prove holds) — the same proof
  # the image's HEALTHCHECK runs.
  image:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t qpu .
      - name: The boot proves itself (qpu_prove holds inside the image)
        run: docker run --rm qpu node dist/quantum/processing/unit/boot.js --prove

  # NPM AND THE RELEASE (a tag): the GitHub Release first (Zenodo archives it), with the notes the README generator
  # writes, then npm through OIDC trusted publishing, then the check that every surface serves this exact version.
  publish:
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          package-manager-cache: false
      # OIDC trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.9 and 404s the PUT.
      - name: npm meets the OIDC floor (>= 11.5.1)
        run: |
          set -euo pipefail
          NPM=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error(`::error::npm ${process.argv[1]} is below the OIDC trusted-publishing floor 11.5.1`);process.exit(1)}' "$NPM"
          echo "npm $NPM meets the OIDC floor 11.5.1"
      - run: npm ci
      - name: Version lock (v1.<minor>.<digit>; previous version released on npm)
        run: npm run version:lock
      - run: npm run build
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      - name: GitHub Release (Zenodo archives it), its notes the README generator's summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already exists"
          elif [ -f RELEASE.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "@uuidna/qpu $GITHUB_REF_NAME" --notes-file RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: npm publish (OIDC trusted publishing; E404 on PUT means npmjs.com has no trusted publisher for this workflow)
        run: |
          # a version npm already serves is done: npm never takes the same version twice, and a re-release of the
          # tag (its Release and archive) must not fail on it
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "@uuidna/qpu@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::@uuidna/qpu@$VERSION is already on npm; the Release and the archive are this run's"
            exit 0
          fi
          set +e
          npm publish --provenance --access public --tag "$(node scripts/version-lock.mjs --dist-tag)" 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "E404" publish.log; then
            echo "::error::npm refused the PUT with 404: npmjs.com has no trusted publisher for uuidna/qpu + publish.yml. Set one under the package's Settings → Trusted publishers (GitHub Actions, repository uuidna/qpu, workflow publish.yml), then rerun this job. The GitHub Release and the Zenodo archive are already made."
          fi
          exit $status
      - name: Verify the release is complete and live — npm, provenance, Release, Zenodo
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ATTEMPTS: '30'
          VERIFY_EVERY_MS: '10000'
        run: node scripts/verify-release.mjs "${GITHUB_REF_NAME#v}"
