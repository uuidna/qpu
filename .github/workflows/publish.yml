name: publish

# COMBINATORIAL CI. ONE WORKFLOW — this file, because npm's trusted publisher is bound to publish.yml.
# The matrix is read from the tree, not typed as a second list: runtime (vinext, opennext), the plugin extremes
# none and all (CLOUDFLARE_PLUGINS; the generator seals every subset by combinatorics.binomial), occupancy
# (personal, business, corporate, saas, paas), and os (ubuntu-latest — the runner OS is Linux). The
# payload-cloudflare generator, in `build`, enumerates runtime × db × storage × email × frontend × every plugin
# subset. IaaS and FaaS are unnamed leads and are not cells. Alpine is the `image` job; the matrix does not boot it.
# Jobs the matrix does not cover stay named: build (Lean kernel, gate, scripts, prove, generated files, generator),
# deploy (the one Worker), test (the live host), image (Alpine), publish (a tag). A push to main deploys and then
# tests what it deployed; a tag also publishes. Nothing else runs a workflow.

on:
  push:
    branches: [main]
    tags: ['v1.*.[0-9]']
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # AXES, from the source the combinations are computed from. A name added to a constant enters the matrix; a name
  # removed leaves it. IaaS and FaaS are not constants here.
  axes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.axes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Read the combinatorial axes
        id: axes
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs'
          const grab = (src, name) => {
            const m = src.match(new RegExp(`(?:export )?const ${name} = \\[([^\\]]+)\\]`))
            if (!m) throw new Error(`missing ${name}`)
            return [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1])
          }
          const cf = readFileSync('src/deployment/payload-cloudflare.ts', 'utf8')
          const unit = readFileSync('src/quantum/processing/unit/index.ts', 'utf8')
          const docker = readFileSync('Dockerfile', 'utf8')
          const workflow = readFileSync('.github/workflows/publish.yml', 'utf8')
          const runtime = grab(cf, 'CLOUDFLARE_RUNTIMES')
          const plugins = grab(cf, 'CLOUDFLARE_PLUGINS')
          const db = grab(cf, 'CLOUDFLARE_DATABASES')
          const storage = grab(cf, 'CLOUDFLARE_STORAGE')
          const email = grab(cf, 'CLOUDFLARE_EMAIL')
          const frontend = grab(cf, 'CLOUDFLARE_FRONTENDS')
          const occupancy = grab(unit, 'occupancies')
          for (const r of ['vinext', 'opennext']) if (!runtime.includes(r)) throw new Error(`runtime ${r} is not on the axis`)
          for (const o of ['personal', 'business', 'corporate', 'saas', 'paas']) if (!occupancy.includes(o)) throw new Error(`occupancy ${o} is not on the axis`)
          if (plugins.length === 0 || db.length === 0 || storage.length === 0 || email.length === 0 || frontend.length === 0) throw new Error('an axis is empty')
          const leads = ['iaas', 'faas']
          const named = [...runtime, ...plugins, ...db, ...storage, ...email, ...frontend, ...occupancy]
          for (const lead of leads) if (named.some((n) => n.toLowerCase() === lead)) throw new Error(`${lead} is an unnamed lead, not an environment`)
          if (!docker.includes('node:26-alpine')) throw new Error('the Alpine image is not the one the tree names')
          if (!workflow.includes('docker run --rm qpu node dist/quantum/processing/unit/boot.js --prove')) throw new Error('the image job is the Alpine prove; it is not in this workflow')
          const os = ['ubuntu-latest']
          const matrix = { runtime, plugins: ['none', 'all'], occupancy, os }
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`)
          console.log(JSON.stringify({ matrix, db, storage, email, frontend, plugins, image: 'alpine' }))
          EOF

  # ONE CELL PER NAMED TUPLE. The generator in `build` is what enumerates the full product; a cell checks that this
  # tuple is one the tree names, on the runner OS that tuple selected.
  combinatorial:
    needs: axes
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.axes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: This cell is a named environment
        env:
          RUNTIME: ${{ matrix.runtime }}
          PLUGINS: ${{ matrix.plugins }}
          OCCUPANCY: ${{ matrix.occupancy }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const grab = (src, name) => {
            const m = src.match(new RegExp(`(?:export )?const ${name} = \\[([^\\]]+)\\]`))
            if (!m) throw new Error(`missing ${name}`)
            return [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1])
          }
          const cf = readFileSync('src/deployment/payload-cloudflare.ts', 'utf8')
          const unit = readFileSync('src/quantum/processing/unit/index.ts', 'utf8')
          const runtime = grab(cf, 'CLOUDFLARE_RUNTIMES')
          const plugins = grab(cf, 'CLOUDFLARE_PLUGINS')
          const occupancy = grab(unit, 'occupancies')
          const cellRuntime = process.env.RUNTIME
          const cellPlugins = process.env.PLUGINS
          const cellOccupancy = process.env.OCCUPANCY
          const cellOs = process.env.OS
          if (!runtime.includes(cellRuntime)) throw new Error(`${cellRuntime} is not a runtime`)
          if (!occupancy.includes(cellOccupancy)) throw new Error(`${cellOccupancy} is not an occupancy`)
          if (cellOs !== 'ubuntu-latest') throw new Error(`${cellOs} is not the runner this workflow names`)
          if (process.env.RUNNER_OS !== 'Linux') throw new Error(`ubuntu-latest reported ${process.env.RUNNER_OS}, not Linux`)
          const pluginSegment = cellPlugins === 'all' ? [...plugins].sort().join('+') : cellPlugins === 'none' ? '-' : null
          if (pluginSegment === null) throw new Error(`${cellPlugins} is not a plugin extreme`)
          if (cellPlugins === 'all' && plugins.some((p) => !pluginSegment.split('+').includes(p))) throw new Error('all does not name every CLOUDFLARE_PLUGINS entry')
          const key = `${cellRuntime}/qpu-raid/r2/none/next/${pluginSegment}`
          console.log(JSON.stringify({ key, occupancy: cellOccupancy, os: cellOs, runner: process.env.RUNNER_OS }))
          EOF

  # NODE: install by the lockfile, the Lean kernel (cached as a receipt keyed on the proof and the toolchain pin), the
  # build and the gate (every operation resolves by UUID and qpu_prove holds).
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      # push, pull_request, workflow_dispatch. The schedule runs the same scan in `test`.
      - name: Scan public channels through the QPU MCP
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: &channel_scan |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { execSync } from 'node:child_process'
          import { existsSync, readFileSync, readdirSync, writeFileSync } from 'node:fs'
          const MCP = 'https://qpu.uuidna.com/mcp'
          const FACES = 14
          const call = async (args) => {
            let last = new Error('unreached')
            for (let again = 0; again < 3; again++) {
              try {
                const r = await fetch(MCP, { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name: 'cite', arguments: args } }), signal: AbortSignal.timeout(180000) })
                if (r.status >= 500) throw new Error(`cite ${r.status}`)
                const b = await r.json()
                if (!b.result) throw new Error(b.error?.message ?? 'cite')
                return b.result.structuredContent ?? {}
              } catch (e) {
                last = e instanceof Error ? e : new Error(String(e))
                if (again === 2) break
                await new Promise((ok) => setTimeout(ok, 5000 * (again + 1)))
              }
            }
            throw last
          }
          const waveOf = (sc) => {
            const step = sc.steps?.at?.(-1)
            const reading = step?.reading ?? {}
            return { hex: reading.hex ?? sc.uuid ?? null, value: sc.value ?? step?.value ?? reading.value ?? null, holds: sc.holds === true, receipt: sc.receipt ?? reading.receipt ?? null }
          }
          const grab = (src, name) => {
            const m = src.match(new RegExp(`(?:export )?const ${name} = \\[([^\\]]+)\\]`))
            return m ? [...m[1].matchAll(/'([^']+)'/g)].map((x) => x[1]) : []
          }
          const workflow = readFileSync('.github/workflows/publish.yml', 'utf8')
          const cf = readFileSync('src/deployment/payload-cloudflare.ts', 'utf8')
          const unit = readFileSync('src/quantum/processing/unit/index.ts', 'utf8')
          const listed = [...new Set([
            ...grab(cf, 'CLOUDFLARE_RUNTIMES'),
            ...grab(cf, 'CLOUDFLARE_DATABASES'),
            ...grab(cf, 'CLOUDFLARE_STORAGE'),
            ...grab(cf, 'CLOUDFLARE_EMAIL'),
            ...grab(cf, 'CLOUDFLARE_FRONTENDS'),
            ...grab(cf, 'CLOUDFLARE_PLUGINS'),
            ...grab(unit, 'occupancies'),
            ...grab(workflow, 'os'),
            ...(workflow.includes('node:26-alpine') ? ['node:26-alpine', 'alpine'] : []),
            ...(workflow.includes('registry.npmjs.org') ? ['npm'] : []),
            ...[...workflow.matchAll(/plugins: \['([^']+)', '([^']+)'\]/g)].flatMap((m) => [m[1], m[2]]),
          ])]
          const unnamed = grab(workflow, 'leads')
          const terms = new Set()
          for (const family of readdirSync('src/families')) {
            let src
            try { src = readFileSync(`src/families/${family}/index.ts`, 'utf8') } catch { continue }
            if (family.length > 2) terms.add(family.toLowerCase())
            const listedNames = src.match(/for \(const name of \[([^\]]+)\]/)
            if (listedNames) for (const n of listedNames[1].matchAll(/'([^']+)'/g)) if (n[1].length > 2) terms.add(n[1].toLowerCase())
          }
          const tokensOf = (s) => [...new Set(s.toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 2 && terms.has(w)))]
          const file = 'channels-receipt.json'
          const text = existsSync(file) ? readFileSync(file, 'utf8') : ''
          const doc = text ? JSON.parse(text) : { kind: 'channels-receipt', lines: [] }
          const prior = [...(doc.lines ?? [])].reverse().find((l) => l.kind === 'channels')
          const page = Number.isInteger(prior?.next) && prior.next > 0 ? prior.next : 2
          const search = JSON.parse(execSync(`gh api "search/repositories?q=is:public&per_page=${FACES}&page=${page}&sort=updated&order=desc"`, { encoding: 'utf8', maxBuffer: 1 << 20 }))
          const items = (search.items ?? []).filter((r) => r.private === false).slice(0, FACES)
          const addresses = items.map((r) => ({ address: r.html_url, repo: r.full_name, archived: r.archived === true, tokens: tokensOf(r.full_name) }))
          const next = page * FACES >= 1000 ? 1 : page + 1
          const [waves, develop, massive, npm, alpine] = await Promise.all([
            call({ hex: { family: 'wave', program: ['waves'], params: [FACES] } }).then(waveOf),
            call({ hex: { family: 'merkaba', program: ['develop'], params: [0, 0, 0] } }).then(waveOf),
            call({ hex: { family: 'wave', program: ['massive'], params: [0] } }).then(waveOf),
            call({ door: 'data', arguments: { source: 'npm' } }),
            call({ door: 'data', arguments: { source: 'alpine' } }),
          ])
          const record = {
            kind: 'channels',
            events: ['push', 'pull_request', 'workflow_dispatch', 'schedule'],
            jobs: { push: 'build', pull_request: 'build', workflow_dispatch: 'build', schedule: 'test' },
            deploy: 'deploy',
            wave: FACES,
            page,
            next,
            githubMcp: null,
            githubCall: `gh api search/repositories?q=is:public&per_page=${FACES}&page=${page}&sort=updated&order=desc`,
            waveCall: { formula: 'wave.waves', params: [FACES], ...waves },
            develop: { formula: 'merkaba.develop', params: [0, 0, 0], ...develop },
            massive: { formula: 'wave.massive', params: [0], ...massive, unnamed, absent: 'github mcp server' },
            npm: { source: 'npm', url: npm.url ?? null, holds: npm.holds === true, agrees: npm.agrees === true, latest: npm.reading?.latest ?? null, receipt: npm.receipt ?? null },
            alpine: { source: 'alpine', url: alpine.url ?? null, holds: alpine.holds === true, agrees: alpine.agrees === true, apps: alpine.reading?.apps ?? null, digest: alpine.reading?.digest ?? null, receipt: alpine.receipt ?? null },
            channels: listed.map((name) => ({ name, tokens: tokensOf(name) })),
            addresses,
          }
          const block = JSON.stringify(record, null, 1).split('\n').map((l) => `  ${l}`).join('\n')
          const at = text.lastIndexOf('\n ]\n}')
          const candidate = at < 0
            ? JSON.stringify({ kind: 'channels-receipt', lines: [record] }, null, 1) + '\n'
            : `${text.slice(0, at)},\n${block}${text.slice(at)}${text.endsWith('\n') ? '' : '\n'}`
          JSON.parse(candidate)
          writeFileSync(file, candidate)
          console.log(JSON.stringify({ wave: record.wave, hex: record.waveCall.hex, value: record.waveCall.value, holds: record.waveCall.holds, addresses: addresses.length, next, githubMcp: null }))
          EOF
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      - name: Kernel receipt (index.lean bytes and the toolchain pin already checked in an earlier run)
        id: kernel
        uses: actions/cache/restore@v6
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'src/quantum/processing/unit/lean/**', 'src/quantum/processing/unit/index.lean') }}
      - name: Lean toolchain cache (keyed on lean-toolchain; only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        id: elan
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Lean kernel (only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.elan.outputs.cache-hit }}" != "true" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          npm run lean
          sha256sum lean-toolchain src/quantum/processing/unit/index.lean > .lean-ok
      - name: Save the kernel receipt (only after the kernel passed here)
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'src/quantum/processing/unit/lean/**', 'src/quantum/processing/unit/index.lean') }}
      - name: The gate is a formula (gate.push of the unit this build compiled)
        run: |
          set -euo pipefail
          npm run build
          # the public host is the previous deploy. This build's gate is these bytes: boot presents them as the named origin.
          node dist/quantum/processing/unit/boot.js > boot.log 2>&1 &
          echo $! > boot.pid
          trap 'kill "$(cat boot.pid)" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            if grep -q 'serving https://qpu.uuidna.com' boot.log; then break; fi
            sleep 1
          done
          grep -q 'serving https://qpu.uuidna.com' boot.log
          QPU_HOST=http://localhost:8787 node scripts/receipt.mjs gate push
      - name: The scripts suites (every scripts/*.test.mjs, discovered by glob)
        run: npm run test:scripts
      # EVERY SCALE PROVES QUANTUM: standalone here (the booted unit proves itself), the container in `image`, the
      # Worker in `test` against the live host; all three run the same qpu_prove on the same bytes
      - name: Standalone proves itself (qpu_prove holds in the booted unit)
        run: node dist/quantum/processing/unit/boot.js --prove
      # README.md is not in the list: its root node is the commit, which the commit that carries the README cannot know,
      # so the README is accountable to the commit before it by design and would always differ here.
      - name: The generated files are what the spec and the receipts generate (deployment, configs, registries, release notes)
        run: |
          node scripts/payload-cloudflare.mjs --repo > /dev/null
          npm run readme
          git diff --exit-code -- wrangler.jsonc Dockerfile docker-compose.yml k8s src/payload.config.ts src/mcp/families.ts src/receipts/index.ts package.json src/blocks/index.ts src/components/blocks/index.ts tsconfig.json tsconfig.payload.json RELEASE.md .zenodo.json
      - name: The generator enumerates every combination (runtime, db, storage, email, frontend, plugin subset)
        run: npm run payload:cf
      - name: The generator's receipt holds
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const r = JSON.parse(readFileSync('payload-cf-receipt.json', 'utf8'))
          if (r.combinatorics?.holds !== true) throw new Error('combinatorics does not hold')
          if ((r.typechecked?.failing?.length ?? 1) !== 0) throw new Error('a base failed typecheck')
          if (r.typechecked?.ok !== r.typechecked?.bases) throw new Error('a base was not typechecked')
          if (r.frontends?.ok !== true) throw new Error('a frontend did not generate')
          if (r.stream?.holds !== true) throw new Error('the payload-cf stream does not hold')
          console.log(JSON.stringify({ combinations: r.combinations, bases: r.typechecked.bases, ok: r.typechecked.ok, plugins: r.plugins, runtimes: r.axes.runtime, frontends: r.frontends.axis }))
          EOF

  # CLOUDFLARE WORKERS: the one Worker (uuidna-qpu = the Payload app fronted by the unit) built by OpenNext and deployed.
  # The channel scan in `build` has run. This job follows it on push and workflow_dispatch.
  deploy:
    needs: [build, combinatorial]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Build and deploy the one Worker (named when the token is missing)
        env:
          # the build reads the config; the Worker's own secret is set on Cloudflare and never leaves it
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'build-only' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            # deploys are manual by design: the token is the one credential the tree cannot supply itself, deliberately
            # kept out of CI. A push does not ship; it is released by `npm run ship` run locally with the token. So the
            # missing token is expected, a warning, never a failed workflow — the tests below run against the live host.
            echo "::warning::not deployed: no CLOUDFLARE_API_TOKEN secret — deploys are manual ('npm run ship' with the token). To ship on push instead, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions. The tests below run against the live host as it stands."
          else
            npm run ship
          fi

  # THE LIVE HOST: every test runs against https://qpu.uuidna.com — after the deploy on a push, as it stands on a pull
  # request or the schedule. On the schedule a failure is filed as the one open `examine` issue.
  test:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'success' || github.event_name == 'schedule') && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Scan public channels through the QPU MCP
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: *channel_scan
      - run: npm ci
      - name: Every test, against the live host
        id: live
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          node scripts/examine.mjs https://qpu.uuidna.com 2>&1 | tee -a test.log
          status=$(( status | PIPESTATUS[0] ))
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: File the findings as the open examine issue (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(printf 'Scheduled run against https://qpu.uuidna.com failed on %s (run %s).\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$(grep -E 'not ok|FIND|# (fail|pass)|examine:' test.log | head -80)")"
          number="$(gh issue list --label examine --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create examine --description 'findings of the scheduled run against the live host' --color D93F0B 2>/dev/null || true
            gh issue create --title "examine: qpu.uuidna.com has findings" --label examine --body "$body"
          fi

  # THE CONTAINER, kept by name: Alpine (node:26-alpine). The combinatorial matrix runs on ubuntu-latest and does not
  # boot this image. The generated image builds, and inside it the unit proves itself (qpu_prove holds) — the same
  # proof the image's HEALTHCHECK runs.
  image:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t qpu .
      - name: The boot proves itself (qpu_prove holds inside the image)
        run: docker run --rm qpu node dist/quantum/processing/unit/boot.js --prove

  # NPM AND THE RELEASE (a tag): the GitHub Release first (Zenodo archives it), with the notes the README generator
  # writes, then npm through OIDC trusted publishing, then the check that every surface serves this exact version.
  publish:
    needs: [test, image, combinatorial]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          package-manager-cache: false
      # OIDC trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.9 and 404s the PUT.
      - name: npm meets the OIDC floor (>= 11.5.1)
        run: |
          set -euo pipefail
          NPM=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error(`::error::npm ${process.argv[1]} is below the OIDC trusted-publishing floor 11.5.1`);process.exit(1)}' "$NPM"
          echo "npm $NPM meets the OIDC floor 11.5.1"
      - run: npm ci
      - name: Version lock (v1.<minor>.<digit>, forward)
        run: npm run version:lock
      - run: npm run build
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      - name: GitHub Release (Zenodo archives it), its notes the README generator's summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already exists"
          elif [ -f RELEASE.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "@uuidna/qpu $GITHUB_REF_NAME" --notes-file RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: npm publish (OIDC trusted publishing; E404 on PUT means npmjs.com has no trusted publisher for this workflow)
        run: |
          # a version npm already serves is done: npm never takes the same version twice, and a re-release of the
          # tag (its Release and archive) must not fail on it
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "@uuidna/qpu@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::@uuidna/qpu@$VERSION is already on npm; the Release and the archive are this run's"
            exit 0
          fi
          set +e
          npm publish --provenance --access public --tag "$(node scripts/version-lock.mjs --dist-tag)" 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "E404" publish.log; then
            echo "::error::npm refused the PUT with 404: npmjs.com has no trusted publisher for uuidna/qpu + publish.yml. Set one under the package's Settings → Trusted publishers (GitHub Actions, repository uuidna/qpu, workflow publish.yml), then rerun this job. The GitHub Release and the Zenodo archive are already made."
          fi
          exit $status
      - name: Verify the release is complete and live — npm, provenance, Release, Zenodo
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ATTEMPTS: '30'
          VERIFY_EVERY_MS: '10000'
        run: node scripts/verify-release.mjs "${GITHUB_REF_NAME#v}"
