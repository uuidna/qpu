name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          package-manager-cache: false
      # OIDC trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.9 and 404s the PUT.
      - name: npm meets the OIDC floor (>= 11.5.1)
        run: |
          set -euo pipefail
          NPM=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error(`::error::npm ${process.argv[1]} is below the OIDC trusted-publishing floor 11.5.1`);process.exit(1)}' "$NPM"
          echo "npm $NPM meets the OIDC floor 11.5.1"
      - run: npm ci
      - run: npm run build
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      # THE ARCHIVE FIRST. The GitHub Release is what Zenodo's integration archives (uuidna/qpu-<tag>.zip under the
      # concept DOI), and it depends on nothing but the tag; npm publish depends on a trusted publisher being set on
      # npmjs.com for this workflow, which failed twice before with E404 on PUT and took the release down with it.
      - name: GitHub Release (Zenodo archives it)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: npm publish (OIDC trusted publishing; E404 on PUT means npmjs.com has no trusted publisher for this workflow)
        run: |
          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "E404" publish.log; then
            echo "::error::npm refused the PUT with 404: npmjs.com has no trusted publisher for uuidna/qpu + publish.yml. Set one under the package's Settings → Trusted publishers (GitHub Actions, repository uuidna/qpu, workflow publish.yml), then rerun this job. The GitHub Release and the Zenodo archive are already made."
          fi
          exit $status
