name: next
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
# least privilege (Scorecard Token-Permissions): the tree is read, the receipt uploaded by the runtime token alone
permissions:
  contents: read
jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lean toolchain (elan, pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm run next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: receipt
          path: |
            docs/public/receipt.json
            docs/public/verification.json
            docs/.vitepress/dist
