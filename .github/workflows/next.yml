name: next
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
# least privilege (Scorecard Token-Permissions): the tree is read, the receipt uploaded by the runtime token alone
permissions:
  contents: read
jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lean toolchain (elan, pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm run next
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: receipt
          path: |
            docs/public/receipt.json
            docs/public/verification.json
            docs/.vitepress/dist
