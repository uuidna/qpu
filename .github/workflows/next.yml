name: next
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lean toolchain (elan, pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm run next
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt
          path: |
            docs/public/receipt.json
            docs/public/verification.json
            docs/.vitepress/dist
