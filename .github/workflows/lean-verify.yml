name: lean-verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lake-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Lake verifies everything
        # the build, the claim manifest, the files rendered from Lean, and the draft applications
        run: lake run verify
