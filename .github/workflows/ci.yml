name: ci

# One job, one checkout, one install: the gate (Lean kernel + receipted suite), and — when called with deploy — the
# verification of the deploy in the same job, so main never spins a second runner to redo what this one just did.
# (Cloudflare's Git integration is what deploys; this job proves the host serves the bytes it built.)
# The Lean toolchain is cached on the pin in lean-toolchain; elan runs only on a miss.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: deploy to Cloudflare after the gate, then verify the host serves the bytes this build makes
        type: boolean
        default: false
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      # KERNEL RECEIPT. The proof is one file and the kernel is deterministic: the same bytes under the same toolchain
      # pin check the same way every time. So the kernel's pass is cached as a receipt keyed on both hashes, and the
      # toolchain (a large restore) is fetched and run only when the proof or the pin changed. The receipt is saved
      # only after the kernel passed in this run; a failing run saves nothing.
      - name: Kernel receipt (index.lean bytes and the toolchain pin already checked in an earlier run)
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'src/quantum/processing/unit/index.lean') }}
      - name: Lean toolchain cache (keyed on lean-toolchain; only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        id: elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Lean kernel (only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.elan.outputs.cache-hit }}" != "true" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          npm run lean
          sha256sum lean-toolchain src/quantum/processing/unit/index.lean > .lean-ok
      - name: Save the kernel receipt (only after the kernel passed here)
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'src/quantum/processing/unit/index.lean') }}
      - name: Kernel receipt hit
        if: steps.kernel.outputs.cache-hit == 'true'
        run: echo "::notice::kernel receipt hit — index.lean and lean-toolchain are byte-identical to a build the kernel already checked ($(cat .lean-ok | tr '\n' ' '))"
      - name: Gate — the receipted suite (live tests in process; the reach budget short, a runner's reach is no reading)
        env:
          QPU_REACH_BUDGET_MS: '3000'
        run: npm test
      - name: Deploy to Cloudflare (only when called with deploy and the token exists)
        id: deploy
        if: ${{ inputs.deploy }}
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_CF" = "true" ]; then
            npm exec -- wrangler deploy
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::gate PASSED but the worker was not deployed — CLOUDFLARE_API_TOKEN is not set"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
      # Cloudflare's Git integration deploys qpu.uuidna.com on its own within about a minute of a push to main; the
      # wrangler step above is a no-op until a token is set. So the verification does not wait on that step: it polls
      # until the host serves, byte for byte, the documents this build makes, then runs the live suite against it.
      - name: Verify the host serves this build — bytes equal, then the live suite against it
        if: ${{ inputs.deploy }}
        env:
          VERIFY_ATTEMPTS: '60'
        run: |
          node scripts/verify-live.mjs https://qpu.uuidna.com
          QPU_LIVE=https://qpu.uuidna.com node --test --test-reporter=spec dist/quantum/processing/unit/live.test.js
