name: ci

# theorem qpuCi : the one gate. Deploy and release call this workflow.
# Proof. elan decides clay; npm ci then npm test (occupancy + VitePress source).
# Push to main does not fire this file directly (deploy calls it).

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      - name: Clay kernel
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Gate — occupancy identities, named doors, clay decide
        run: npm run ci
