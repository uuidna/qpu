name: ci

# THE ONE DOOR. Deploy and release call this. Push to main does not also fire it —
# that cancelled the gate while deploy reused the same concurrency group.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      - name: Gate — audit, tests, paper, docs, wrangler dry-run
        run: npm run ci
