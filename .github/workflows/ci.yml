name: ci

# One job, one checkout, one install: the gate (Lean kernel + receipted suite), and — when called with deploy — the
# verification of the deploy in the same job, so main never spins a second runner to redo what this one just did.
# (Cloudflare's Git integration is what deploys; this job proves the host serves the bytes it built.)
# The Lean toolchain is cached on the pin in lean-toolchain; elan runs only on a miss.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: deploy to Cloudflare after the gate, then verify the host serves the bytes this build makes
        type: boolean
        default: false
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install exact (lockfile law; no install scripts)
        run: npm ci
      # KERNEL RECEIPT. The proof is one file and the kernel is deterministic: the same bytes under the same toolchain
      # pin check the same way every time. So the kernel's pass is cached as a receipt keyed on both hashes, and the
      # toolchain (a large restore) is fetched and run only when the proof or the pin changed. The receipt is saved
      # only after the kernel passed in this run; a failing run saves nothing.
      - name: Kernel receipt (index.lean bytes and the toolchain pin already checked in an earlier run)
        id: kernel
        uses: actions/cache/restore@v6
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'src/quantum/processing/unit/index.lean') }}
      - name: Lean toolchain cache (keyed on lean-toolchain; only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        id: elan
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Lean kernel (only when the receipt is missing)
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.elan.outputs.cache-hit }}" != "true" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          npm run lean
          sha256sum lean-toolchain src/quantum/processing/unit/index.lean > .lean-ok
      - name: Save the kernel receipt (only after the kernel passed here)
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lean-ok
          key: lean-ok-${{ hashFiles('lean-toolchain', 'src/quantum/processing/unit/index.lean') }}
      - name: Kernel receipt hit
        if: steps.kernel.outputs.cache-hit == 'true'
        run: echo "::notice::kernel receipt hit — index.lean and lean-toolchain are byte-identical to a build the kernel already checked ($(cat .lean-ok | tr '\n' ' '))"
      - name: Gate — the receipted suite (live tests in process)
        run: npm test
      # THE PROOF IS A GATE. The suite writes test-receipt.json; the unit, the climb and the receipts are deterministic,
      # so the committed file must equal this run's byte for byte. A stale commit of the proof fails here, and the
      # diff says which row moved.
      - name: Proof — the committed test-receipt.json is this run's
        run: git diff --exit-code -- test-receipt.json || { echo "::error::test-receipt.json differs from this run; commit the regenerated proof with the change that moved it"; git --no-pager diff -- test-receipt.json | head -80; exit 1; }
      # THE GUARDS, PROVED ABLE TO FAIL. The gate above says the suite agrees with the build; it cannot say the suite
      # would notice a broken one. Each mutant is an edit that should break a named guard, and a SURVIVOR is the
      # finding — a property nothing actually checks. Runs here rather than nightly because six mutants cost about a
      # minute and a guard that stops guarding does so on the commit that breaks it, not overnight.
      # It uses test:rollcall, which attaches no reporter: with `npm test` each mutant rewrote test-receipt.json and
      # the last mutant's receipt was left on disk, which failed the proof step above.
      - name: Mutation — every guard proved able to fail
        run: npm run mutate

      # THE DEBTS THIS TREE CARRIES, in one step rather than four. Walls with no cause named, bare numbers
      # the lattice already names, refusals with no theorem behind them, and tests that computed nothing —
      # the same machine four times, each with its own floor that may only shrink. A gate nobody runs is not
      # a gate, and four commands is how you get one nobody runs.
      - name: Debts — every floor may only shrink
        run: npm run debts

      # THE PROOF GATE ABOVE IS ONLY HONEST IF THE PROOF IS A PROPERTY OF THIS TREE. It was not: the readers reach
      # opendata.cern.ch, and a run that reached it folded differently from one that did not, so the gate reported a
      # moved receipt and named this repository for someone else's maintenance window. It rejected two pushes that
      # way before the cause was clear.
      # The verdict is pure and costs nothing, so it runs always. The full comparison re-runs the suite under each
      # of the four shapes a third party fails in — refused, 503, a captive portal's 200, and a silent socket — and
      # requires test-receipt.json to come back byte-identical from all of them plus the network as it is. Three of
      # those four shapes were live defects the first time they were run.
      # It runs AFTER the proof step, for the reason the mutation step does: it rewrites test-receipt.json.
      # EVERY scripts/ TEST, BY GLOB — and the hand list this replaces is the reason. This step named ONE test file,
      # `outage:test`, so the four other scripts/*.test.mjs suites ran in no chain at all: leads:test existed only
      # inside `npm run ci`, which no workflow invokes, and pace/percall/temporal were reachable from nothing. All
      # five pass; they were simply never asked, which is the failure mode a green board cannot show. The glob is
      # node's own documented form for selecting test files, so a suite added tomorrow is run the day it exists
      # (a bare directory argument is NOT that form on this runtime — it is loaded as a module and fails).
      - name: Guards — every scripts/ suite, discovered rather than listed
        run: npm run test:scripts
      - name: Outage — the committed proof does not move for a third party's weather
        run: npm run outage
      # A LIMIT ASSERTED WITHOUT A CAUSE is a choice wearing the costume of a limit: nobody re-examines it, so the
      # work behind it never gets done. This reads every comment in the package that says something cannot be done
      # and clears only the ones that name why. A RISE fails; a fall rewrites the receipt, and the proof step turns
      # that into a diff that has to be committed deliberately. Ported from the sibling repository with the two
      # corrections it paid for: unreadable is never folded into clean, and the keyword list admits the very cure
      # the finding prints.
      - name: Walls — no new limit is asserted without naming its cause
        run: npm run walls

      - name: Deploy to Cloudflare (only when called with deploy and the token exists)
        id: deploy
        if: ${{ inputs.deploy }}
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_CF" = "true" ]; then
            npm exec -- wrangler deploy
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::gate PASSED but the worker was not deployed — CLOUDFLARE_API_TOKEN is not set"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
      # Cloudflare's Git integration deploys qpu.uuidna.com on its own within about a minute of a push to main; the
      # wrangler step above is a no-op until a token is set. So the verification does not wait on that step: it polls
      # until the host serves, byte for byte, the documents this build makes, then runs the live suite against it.
      - name: Verify the host serves this build — bytes equal, then the live suite against it
        if: ${{ inputs.deploy }}
        env:
          VERIFY_ATTEMPTS: '60'
        run: |
          node scripts/verify-live.mjs https://qpu.uuidna.com
          QPU_LIVE=https://qpu.uuidna.com node --test --test-reporter=spec dist/quantum/processing/unit/live.test.js
          node scripts/examine.mjs https://qpu.uuidna.com

  # THE BOOT'S RECEIPT: the image builds, and inside it the unit proves itself (qpu_prove holds) — the same proof the
  # container's HEALTHCHECK runs. This is what "bootable on hardware" means here; no device is dispatched.
  boot:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v7
      - name: Build the hardware image
        run: docker build -t qpu .
      - name: The boot proves itself (qpu_prove holds inside the image)
        run: docker run --rm qpu node dist/quantum/processing/unit/boot.js --prove
