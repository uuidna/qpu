# Research run by the pipeline, never by hand: OpenAlex searched for every theorem whose meanings changed, the author's works discovered
# under the author's ORCID and each claimed, and every lead verified across every source. What is final is sealed under the hexbit
# address of its request in the committed indexes, so no source is ever asked twice for one thing and a run with nothing new commits
# nothing. What changed goes to a branch and a pull request whose gates this run dispatches (a pull request opened with the workflow's
# own token starts none by itself); land merges it when every gate has passed.
name: research
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Search, discover and claim through OpenAlex
        run: node src/quantum/uuid/programs/0/d/b/3/5/7/8/9/index.ts step textbook '{"scripts":{"claims":true}}' --write
      - name: Verify every lead across every source
        run: node src/quantum/uuid/programs/0/d/b/3/5/7/8/9/index.ts step wave '{}' --write
      - name: Open what changed as a pull request and dispatch its gates
        run: |
          if git diff --quiet -- src/quantum/uuid/programs; then echo "nothing new: every answer was already sealed"; exit 0; fi
          branch="research/${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898341+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- src/quantum/uuid/programs
          git commit -m "Seal the research the pipeline ran" -m "OpenAlex answered the searches and lookups this run owed; each final answer is sealed under the hexbit address of its request in the claims, verified and lead indexes, so none is asked again."
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Seal the research the pipeline ran" --body "Opened by the research workflow (run ${GITHUB_RUN_ID}). Its gates were dispatched on this branch; land merges it when they pass."
          for gate in test.yml lean-verify.yml site.yml alpine.yml; do gh workflow run "$gate" --ref "$branch"; done
