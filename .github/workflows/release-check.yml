name: release-check

# IS THE LAST RELEASE STILL COMPLETE? publish.yml verifies at publish time, which catches a Zenodo webhook that
# never fired while somebody is still watching. It cannot catch what happened here: package.json and CITATION.cff
# both said 0.1.3, npm served 0.1.2, no v0.1.3 tag existed, and the archive held v0.1.2 — for as long as nobody
# thought to look. Publishing is not a moment, it is a state, and a state nothing re-reads is a state nobody knows.
#
# ASKED OF THE LATEST TAG, NOT package.json. The version in the working tree is whatever is being worked on and is
# SUPPOSED to be unpublished; failing on that would be a red badge for doing the normal thing, and a check that
# cries wolf is turned off. A tag is a claim that something was released, so a tag is what must still be true.

on:
  schedule:
    # Weekly. Zenodo's webhook fires in minutes, so a daily run would mostly re-answer a question already settled;
    # what this is for is the slow rot — a yanked version, an archive that never landed, a tag with no release.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: a version to check instead of the latest tag
        type: string
        required: false

concurrency:
  group: release-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: The version to check — the input, else the latest tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IN="${{ inputs.version }}"
          if [ -n "$IN" ]; then
            V="${IN#v}"
            TAG="v$V"
          else
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            if [ -z "$TAG" ]; then
              echo "::notice::no v* tag in this repository — nothing has been released, so there is nothing to re-check"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            V="${TAG#v}"
          fi
          # A TAG WHOSE PUBLISH HAS NOT FINISHED IS NOT YET A RELEASE TO RE-CHECK, and this cost a red badge on
          # 2026-09-28: the v0.1.9 publish ran 13:52:44 to 14:00:07, this check started at 13:57:16 — four and a
          # half minutes in — and gave up at 13:59:12, fifty-five seconds before the publish finished. It then
          # reported npm serving 0.1.6, 0.1.7 and 0.1.8 "not 0.1.9" and no provenance attestation, both of which
          # were true at that instant and neither of which was a defect. npm and Zenodo both hold 0.1.9 now.
          #
          # This is not the lag-gating fault removed from verify-release in 0.1.8 — that was gating on a channel
          # this pipeline does not own. npm and provenance ARE owned here, and a release that never reaches them
          # must stay red. What was wrong is only WHEN the question was asked: while the answer was being written.
          # publish.yml verifies at publish time and is the authority for the minutes it is running; this job is
          # for the slow rot, as the header says, so it waits for the other one to finish having its say.
          if [ -n "${TAG:-}" ]; then
            RUNNING="$(gh run list --workflow=publish.yml --branch "$TAG" --limit 1 --json status --jq '.[0].status // ""' || echo '')"
            if [ "$RUNNING" = "in_progress" ] || [ "$RUNNING" = "queued" ] || [ "$RUNNING" = "requested" ] || [ "$RUNNING" = "waiting" ]; then
              echo "::notice::the publish run for $TAG is $RUNNING — it is still writing the answer this job reads, so there is nothing to re-check yet"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "checking $V"
      # WHAT IS OPEN, GATHERED RATHER THAN ASKED. Every question this work put to a person — commit or stash the
      # dirty tree, public or private for the missing remote, how to supply the write token — was decidable from
      # the tree and the registries, and nobody had written the gathering down. It runs here so the answer arrives
      # without anyone asking for it. Non-blocking: it reports across sibling repos this runner does not check out,
      # so its unreached sources are expected here and must not fail the release check below.
      # The detectors first. A gatherer whose checks never fire always says fine, so the run that reports what is
      # open is preceded by the run that proves it can report anything at all. Blocking, unlike the gathering below.
      - name: Leads — the detectors are proved able to fire
        if: steps.pick.outputs.skip != 'true'
        run: npm run leads:test

      - name: Leads — every source asked, and what each one owes
        if: steps.pick.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/leads.mjs

      # A refusal is not a finding: verify-release reports a host that would not answer as unverifiable and exits
      # zero on it. Only a definite "not there" fails this job.
      - name: npm, provenance, Release and Zenodo all answer for that version
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ATTEMPTS: '6'
          VERIFY_EVERY_MS: '10000'
        run: node scripts/verify-release.mjs "${{ steps.pick.outputs.version }}"
