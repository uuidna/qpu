# theorem qpuDependabot : exact npm pins and Actions hashes on this occupancy.
# Proof. Daily npm, weekly Actions. Live compile does not import archive/.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase
    open-pull-requests-limit: 4
    groups:
      toolchain:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
