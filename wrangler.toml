name = "uuidna-qpu"
main = "src/index.ts"
compatibility_date = "2024-09-29"
account_id = "REQUIRES_CLOUDFLARE_ACCOUNT"
workers_dev = true

[env.production]
name = "uuidna-qpu-prod"
route = "qpu.uuidna.com/*"
zone_id = "REQUIRES_ZONE_ID"

[build]
command = "npm run build"
cwd = "./web"

[[kv_namespaces]]
binding = "CAPTAIN_COINS"
id = "uuidna-captain-coins"

[[kv_namespaces]]
binding = "PHASE_STATE"
id = "uuidna-phase-state"

[[kv_namespaces]]
binding = "METRICS"
id = "uuidna-metrics"

[env.production.kv_namespaces]
binding = "CAPTAIN_COINS"
id = "uuidna-captain-coins-prod"

[env.production.kv_namespaces]
binding = "PHASE_STATE"
id = "uuidna-phase-state-prod"

[env.production.kv_namespaces]
binding = "METRICS"
id = "uuidna-metrics-prod"

[triggers.crons]
cron = "*/5 * * * *"
