# theorem qpuReplica : worker uuidna-qpu is the named host qpu.uuidna.com.
# Proof. Occupancy is src/quantum/processing/unit; main re-exports dist.
# QPU_HOST = unit.host; mismatch or * is lost. HTML is VitePress source. No wildcards.
name = "uuidna-qpu"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[routes]]
pattern = "qpu.uuidna.com"
custom_domain = true

[vars]
# theorem qpuHost : QPU_HOST = unit.host. Proof. Occupancy fetch refuses else.
QPU_HOST = "qpu.uuidna.com"

[assets]
directory = "docs/.vitepress/dist"
binding = "ASSETS"

[version_metadata]
binding = "CF_VERSION_METADATA"
