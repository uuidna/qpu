# Cloudflare Workers Configuration: UUIDNA QPU Edge Deployment
# License: CC-BY-NC-ND-4.0

name = "uuidna-qpu-edge"
type = "javascript"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true
main = "dist/quantum/processing/unit/cloudflare-worker.js"
routes = [
  { pattern = "qpu.example.com/*", zone_name = "example.com" }
]

# Environment configuration
[env.production]
routes = [
  { pattern = "api.example.com/*", zone_name = "example.com" }
]
vars = { NODE_ENV = "production", LOG_LEVEL = "info", FORMULA_CORPUS_SIZE = "42" }

[env.staging]
routes = [
  { pattern = "staging-api.example.com/*", zone_name = "example.com" }
]
vars = { NODE_ENV = "staging", LOG_LEVEL = "debug" }

[env.development]
name = "uuidna-qpu-dev"
workers_dev = true
vars = { NODE_ENV = "development", LOG_LEVEL = "debug" }

# Build configuration
build = { command = "npm run build", cwd = "./" }
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
