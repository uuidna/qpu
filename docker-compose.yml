---
# Docker Compose: Local/Staging UUIDNA QPU Deployment
# License: CC-BY-NC-ND-4.0

version: '3.9'

services:
  # Main QPU service - Formula-based (stateless)
  qpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: uuidna/qpu:latest
    container_name: qpu-main
    ports:
      - "8080:8080"  # HTTP API
      - "9090:9090"  # Prometheus metrics
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FORMULA_CORPUS_SIZE: "42"
      QUANTUM_SIMULATOR: "qiskit"
      MCP_ENABLED: "true"
      # ✅ No DATABASE_URL (formulas computed, not queried)
      # ✅ No REDIS_URL (computation faster than cache lookup)
      # ✅ Pure formula-based computation
    # ✅ No depends_on (no external services needed)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - qpu-network
    # ✅ No volumes (stateless computation)
    labels:
      app: qpu
      version: "0.2.1"
      storage: "formula-based"
      persistence: "none"

  # Optional: Prometheus for metrics (stateless)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: qpu-prometheus
  #   ports:
  #     - "9000:9090"
  #   # ✅ Metrics only - optional for observability

  # Optional: Grafana for dashboards (visualization only)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: qpu-grafana
  #   ports:
  #     - "3000:3000"
  #   # ✅ Dashboard only - optional for UI

  # Optional: Jaeger for distributed tracing (observability)
  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   container_name: qpu-jaeger
  #   ports:
  #     - "6831:6831/udp"  # Jaeger agent
  #     - "16686:16686"     # Jaeger UI
  #   # ✅ Tracing only - optional for debugging

# ✅ No volumes needed (formula-based, stateless)

networks:
  qpu-network:
    driver: bridge

# Deployment instructions:
# 1. Start services: docker-compose up -d
# 2. Access QPU: http://localhost:8080
# 3. Health check: http://localhost:8080/health
# 4. API docs: http://localhost:8080/api
# 5. Stop services: docker-compose down
#
# ✅ Benefits of formula-based architecture:
# - No data persistence needed
# - No volume management
# - Pod loss = instant recompute (no data loss)
# - Infinite horizontal scaling
# - Zero infrastructure overhead
