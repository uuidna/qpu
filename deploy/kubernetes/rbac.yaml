apiVersion: v1
kind: ServiceAccount
metadata:
  name: qpu-sa
  namespace: quantum
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qpu-role
  namespace: quantum
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qpu-rolebinding
  namespace: quantum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qpu-role
subjects:
- kind: ServiceAccount
  name: qpu-sa
  namespace: quantum
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qpu-config
  namespace: quantum
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  METRICS_PORT: "9090"
  POOL_SIZE: "10"
  CACHE_TTL: "3600"
