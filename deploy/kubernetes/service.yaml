apiVersion: v1
kind: Service
metadata:
  name: qpu-service
  namespace: quantum
  labels:
    app: uuidna-qpu
spec:
  type: LoadBalancer
  selector:
    app: uuidna-qpu
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: qpu-internal
  namespace: quantum
  labels:
    app: uuidna-qpu
spec:
  type: ClusterIP
  selector:
    app: uuidna-qpu
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
