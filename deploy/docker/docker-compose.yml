version: '3.8'

services:
  qpu:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: uuidna-qpu
    ports:
      - "3000:3000"    # API server
      - "8080:8080"    # Static web UI
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 3000
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - quantum-network

  # Optional: Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: qpu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-data:/prometheus
    networks:
      - quantum-network

  # Optional: Logging
  grafana:
    image: grafana/grafana:latest
    container_name: qpu-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-data:/var/lib/grafana
    networks:
      - quantum-network

networks:
  quantum-network:
    driver: bridge
