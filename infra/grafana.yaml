apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  qpu-dashboard.json: |
    {
      "dashboard": {
        "title": "UUIDNA QPU - Production Metrics",
        "tags": ["qpu", "production"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Request Rate (req/sec)",
            "targets": [
              {
                "expr": "rate(http_requests_total[1m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "P99 Latency (ms)",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) * 1000"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Memory Usage (MB)",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"qpu-.*\"} / 1024 / 1024"
              }
            ],
            "type": "graph"
          },
          {
            "title": "CPU Usage (%)",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{pod=~\"qpu-.*\"}[5m]) * 100"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Active Connections",
            "targets": [
              {
                "expr": "http_connections_active"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Uptime (hours)",
            "targets": [
              {
                "expr": "up{job=\"qpu\"} * process_uptime_seconds / 3600"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Pod Replicas",
            "targets": [
              {
                "expr": "kube_deployment_status_replicas{deployment=\"qpu\"}"
              }
            ],
            "type": "stat"
          }
        ]
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: admin-password
        - name: GF_INSTALL_PLUGINS
          value: "redis-datasource"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: storage
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: storage
        emptyDir:
          sizeLimit: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: grafana
