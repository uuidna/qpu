---
# Kubernetes Deployment: UUIDNA QPU
# Production-ready quantum formula discovery system
# License: CC-BY-NC-ND-4.0

apiVersion: v1
kind: Namespace
metadata:
  name: qpu-prod
  labels:
    name: qpu-prod
    license: cc-by-nc-nd-4.0

---
# ConfigMap: Application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: qpu-config
  namespace: qpu-prod
data:
  NODE_ENV: production
  LOG_LEVEL: info
  FORMULA_CORPUS_SIZE: "42"
  QUANTUM_SIMULATOR: qiskit
  MCP_ENABLED: "true"
  HEALTHCHECK_TIMEOUT: "30000"

---
# Secret: Sensitive configuration (create with: kubectl create secret generic qpu-secrets ...)
apiVersion: v1
kind: Secret
metadata:
  name: qpu-secrets
  namespace: qpu-prod
type: Opaque
data:
  # Set these values: echo -n "value" | base64
  IBM_QUANTUM_API_KEY: "" # Optional: for real quantum hardware
  DATABASE_URL: "" # Optional: for results persistence
  MONITORING_TOKEN: "" # Optional: for external monitoring

---
# Deployment: UUIDNA QPU main service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qpu-main
  namespace: qpu-prod
  labels:
    app: qpu
    component: main
    version: v0.2.1
    license: cc-by-nc-nd-4.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: qpu
      component: main
  template:
    metadata:
      labels:
        app: qpu
        component: main
        version: v0.2.1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: qpu-sa
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: qpu
        image: uuidna/qpu:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: qpu-config
        - secretRef:
            name: qpu-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: cache
          mountPath: /qpu/cache
        - name: logs
          mountPath: /qpu/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: logs
        emptyDir:
          sizeLimit: 500Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - qpu
              topologyKey: kubernetes.io/hostname

---
# Service: Internal ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: qpu-service
  namespace: qpu-prod
  labels:
    app: qpu
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: qpu
    component: main
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Service: LoadBalancer for external access
apiVersion: v1
kind: Service
metadata:
  name: qpu-loadbalancer
  namespace: qpu-prod
  labels:
    app: qpu
spec:
  type: LoadBalancer
  selector:
    app: qpu
    component: main
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP

---
# HorizontalPodAutoscaler: Auto-scale based on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qpu-hpa
  namespace: qpu-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qpu-main
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# ServiceAccount: RBAC identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qpu-sa
  namespace: qpu-prod
  labels:
    app: qpu

---
# Role: Minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qpu-role
  namespace: qpu-prod
spec:
  rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["qpu-config"]
    verbs: ["get"]

---
# RoleBinding: Assign role to service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qpu-rolebinding
  namespace: qpu-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qpu-role
subjects:
- kind: ServiceAccount
  name: qpu-sa
  namespace: qpu-prod

---
# PodDisruptionBudget: Ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qpu-pdb
  namespace: qpu-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: qpu
      component: main
