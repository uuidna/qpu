---
# Prometheus Alert Rules: UUIDNA QPU Production Monitoring
# License: CC-BY-NC-ND-4.0

groups:
  - name: qpu_service
    interval: 30s
    rules:
      # ========================================================================
      # Service Availability
      # ========================================================================

      - alert: QPUServiceDown
        expr: up{job="qpu-main"} == 0
        for: 2m
        labels:
          severity: critical
          service: qpu
        annotations:
          summary: "QPU service is down"
          description: "QPU main service has been down for more than 2 minutes"
          runbook: "https://github.com/tsvetan/uuidna/wiki/Runbooks#qpu-service-down"

      - alert: QPUHighErrorRate
        expr: rate(http_requests_total{job="qpu-main",status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: qpu
        annotations:
          summary: "QPU high error rate"
          description: "QPU is returning 5xx errors at {{ $value | humanizePercentage }} rate"

      - alert: QPUHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: qpu
        annotations:
          summary: "QPU high latency"
          description: "QPU p95 latency is {{ $value }}s (threshold: 1s)"

      # ========================================================================
      # Resource Usage
      # ========================================================================

      - alert: QPUHighMemoryUsage
        expr: container_memory_usage_bytes{pod=~"qpu-main-.*"} / 1073741824 > 0.8
        for: 5m
        labels:
          severity: warning
          service: qpu
        annotations:
          summary: "QPU pod high memory usage"
          description: "QPU pod {{ $labels.pod }} is using {{ $value | humanize }}GB (limit: 1GB)"

      - alert: QPUHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{pod=~"qpu-main-.*"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: qpu
        annotations:
          summary: "QPU pod high CPU usage"
          description: "QPU pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }}"

      # ========================================================================
      # Database Connectivity
      # ========================================================================

      - alert: QPUDatabaseConnectionsFailed
        expr: rate(db_connection_errors_total{job="qpu-main"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: qpu
          component: database
        annotations:
          summary: "QPU database connection failures"
          description: "QPU is failing to connect to PostgreSQL database"

      - alert: QPUDatabaseHighConnections
        expr: db_connections_active{job="qpu-main"} > 150
        for: 10m
        labels:
          severity: warning
          service: qpu
          component: database
        annotations:
          summary: "QPU database high connection count"
          description: "QPU has {{ $value }} active database connections (threshold: 150)"

      # ========================================================================
      # Cache Performance
      # ========================================================================

      - alert: QPURedisCacheMiss
        expr: rate(redis_cache_misses_total[5m]) / (rate(redis_cache_hits_total[5m]) + rate(redis_cache_misses_total[5m])) > 0.3
        for: 10m
        labels:
          severity: warning
          service: qpu
          component: cache
        annotations:
          summary: "QPU Redis cache high miss rate"
          description: "Cache miss rate is {{ $value | humanizePercentage }} (threshold: 30%)"

      - alert: QPURedisDown
        expr: up{job="redis-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          service: qpu
          component: cache
        annotations:
          summary: "QPU Redis cache is down"
          description: "Redis cache service is unavailable"

      # ========================================================================
      # Formula Computation
      # ========================================================================

      - alert: QPUFormulaComputationTimeout
        expr: rate(formula_computation_timeout_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          service: qpu
          component: computation
        annotations:
          summary: "QPU formula computation timeout"
          description: "Formula computations are timing out ({{ $value }} timeouts/sec)"

      - alert: QPUQuantumValidationFailure
        expr: rate(quantum_validation_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: qpu
          component: quantum
        annotations:
          summary: "QPU quantum validation failures"
          description: "Quantum hardware validation is failing {{ $value | humanizePercentage }} of the time"

      # ========================================================================
      # License Compliance
      # ========================================================================

      - alert: QPULicenseViolation
        expr: license_compliance_violations_total > 0
        for: 1m
        labels:
          severity: critical
          service: qpu
          compliance: cc-by-nc-nd
        annotations:
          summary: "QPU license compliance violation"
          description: "License compliance check has detected {{ $value }} violation(s)"

      # ========================================================================
      # Deployment & Replicas
      # ========================================================================

      - alert: QPUNotEnoughReplicas
        expr: kube_deployment_status_replicas_available{deployment="qpu-main"} < 2
        for: 5m
        labels:
          severity: warning
          service: qpu
          component: deployment
        annotations:
          summary: "QPU insufficient replicas"
          description: "Only {{ $value }} QPU replicas available (minimum: 2)"

      - alert: QPURollingUpdateStuck
        expr: kube_deployment_status_replicas_updated{deployment="qpu-main"} < kube_deployment_spec_replicas{deployment="qpu-main"}
        for: 10m
        labels:
          severity: warning
          service: qpu
          component: deployment
        annotations:
          summary: "QPU rolling update stuck"
          description: "QPU deployment update is not progressing"

  - name: qpu_recording
    interval: 30s
    rules:
      # ========================================================================
      # Recording Rules for Performance
      # ========================================================================

      - record: job:http_requests_total:rate5m
        expr: rate(http_requests_total{job="qpu-main"}[5m])

      - record: job:http_request_duration:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="qpu-main"}[5m]))

      - record: job:formula_computation:rate5m
        expr: rate(formula_computations_total{job="qpu-main"}[5m])

      - record: job:formula_computation:avg_duration
        expr: rate(formula_computation_duration_seconds_sum{job="qpu-main"}[5m]) / rate(formula_computation_duration_seconds_count{job="qpu-main"}[5m])

      - record: job:cache_hit_ratio:rate5m
        expr: rate(redis_cache_hits_total[5m]) / (rate(redis_cache_hits_total[5m]) + rate(redis_cache_misses_total[5m]))
